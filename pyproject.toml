[project]
name = "monitoring-prometheus"
version = "1.0"
requires-python = ">=3.14"
dependencies = [
    "pyyaml (>=6.0.3,<7.0.0)"
]

[tool.poetry.build]
generate-setup-file = false
script = "setup.py"

[tool.poetry.group.test.dependencies]
tox = "^4.67.12"
tox-current-env = "^0.0.17"
black = "^26.10.1"
ruff = "^0.17.4"

[tool.ruff]
line-length = 120

[tool.black]
line-length = 120
