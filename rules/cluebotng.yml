groups:
  - name: ClueBot NG
    rules:
      - alert: BotNotEditedRecently
        expr: time() - max by (tool, source_tool) (cbng_monitoring_last_user_contribution_time{username="ClueBot NG", domain="en.wikipedia.org", job="checker"}) > 7200
        for: 5m
        labels:
          update_wiki_host: en.wikipedia.org
          update_wiki_page: User:ClueBot_NG/running
        annotations:
          summary: ClueBot NG has not edited for > 2 hours

      - alert: BotHasLowEditCount
        expr: max by (tool, source_tool) (cbng_monitoring_recent_user_contributions_count{username="ClueBot NG", domain="en.wikipedia.org", job="checker"}) < 150
        for: 5m
        annotations:
          summary: ClueBot NG has made less than 150 edits in the last 24 hours

      - alert: BotHasBeenAdminDisabled
        expr: min by (tool, source_tool) (cbng_monitoring_bot_administrator_allow_run{username="ClueBot NG", domain="en.wikipedia.org", job="checker"}) == 0
        for: 5m
        annotations:
          summary: ClueBot NG has been disabled via User:ClueBot_NG/Run

      - alert: BotWhitelistNotReloaded
        expr: time() - cbng_bot_whitelist_last_reload_seconds > 86400
        for: 5m
        annotations:
          summary: ClueBot NG has not reloaded the whitelist for > 24 hours

      - alert: BotForksExhausted
        expr: cbng_bot_forks_total == 4
        for: 30m
        annotations:
          summary: ClueBot NG has had 4 forks running for > 30 minutes

      - alert: BotStreamPaused
        expr: cbng_bot_stream_pause_status == 1
        for: 30m
        annotations:
          summary: ClueBot NG stream has been paused for > 30 minutes

      - alert: BotTfaNotReloaded
        expr: time() - cbng_bot_tfa_last_reload_seconds > 129600
        for: 5m
        annotations:
          summary: ClueBot NG has not reloaded the TFA for > 36 hours
