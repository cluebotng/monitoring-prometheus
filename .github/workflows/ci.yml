name: CI
on: { pull_request: { } }
concurrency:
  group: ${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  setup-build:
    uses: infrabits/ci-setup-tox-env/.github/workflows/setup.yml@4f1b39f5c566f6a387aea8ed2c57402dc122b233 # v1.10.0

  execute-lint:
    needs: [setup-build]
    uses: infrabits/ci-run-tox-env/.github/workflows/run.yml@78d52c3c24baa2c85eb416ebbc0917efb42c454f # v1.6.0
    with:
      environments: ${{ needs.setup-build.outputs.lint }}

  execute-test:
    needs: [setup-build]
    uses: infrabits/ci-run-tox-env/.github/workflows/run.yml@78d52c3c24baa2c85eb416ebbc0917efb42c454f # v1.6.0
    with:
      environments: ${{ needs.setup-build.outputs.test }}

  build-container:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [toolforge-stable, toolforge-latest, upstream]
    needs: [setup-build, execute-lint, execute-test]
    permissions:
      security-events: write
      packages: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build container
        uses: infrabits/ci-pack@3a88fca6bcda5a70548567f83e71c80afff792c1 # v2.8.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          image: ghcr.io/${{ github.repository }}:${{ matrix.target }}-${{ github.sha }}
          use_builder: ${{ matrix.target }}
          run_safety_checks: ${{ matrix.target == 'toolforge-stable' && 'true' || 'false' }}

  test-container:
    runs-on: ubuntu-latest
    needs: [build-container]
    strategy:
      fail-fast: false
      matrix:
        target: [toolforge-stable, toolforge-latest, upstream]
    permissions:
      packages: read
    steps:
      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start container
        run: |
          docker pull ghcr.io/${{ github.repository }}:${{ matrix.target }}-${{ github.sha }}
          docker run -d --name prometheus -p 9090:9090 \
            -e TOOL_DATA_DIR=/tmp \
            --entrypoint /cnb/process/prometheus \
            ghcr.io/${{ github.repository }}:${{ matrix.target }}-${{ github.sha }}

      - name: Verify prometheus is ready
        run: |
          timeout 30 bash -c 'until curl --silent --fail http://127.0.0.1:9090/-/ready; do sleep 1; done'

      - name: Container logs
        if: always()
        run: docker logs prometheus
